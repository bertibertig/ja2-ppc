# JA2 PPC runtime options
# Set to 1, true, yes, or on to skip the intro video sequence.
skip_intros=0
show_fps=1
# Profiler (only used by -DJA2_PROFILE=ON builds): quit after N frames
# (0 = run until quit), run without the 16 ms frame delay, and tag the CSV.
profile_frames=0
profile_uncapped=0
profile_label=default
